name: Release

# Manually triggered from the GitHub UI (Actions → Release → Run workflow).
# Order of operations:
#   1. bump version locally
#   2. run tests
#   3. build & push Docker image (so a broken image never produces a git tag)
#   4. commit, tag, push
#   5. publish GitHub Release. Notes are taken from releases/release.md (required for a major release), which is
#      renamed to releases/<version>.md and replaced with an empty file. When it is empty, notes are
#      auto-generated (.github/release.yml)
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Semver bump'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        type: boolean
        default: false
      dry-run:
        description: 'Dry run (no commit, tag, image push or release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Guard against running on a non-default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Release must be run from the default branch (${{ github.event.repository.default_branch }}), got ${{ github.ref }}"
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - run: npm ci

      - run: npm test

      - name: Bump version (working tree only)
        id: bump
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          npm version "${{ inputs.bump }}" --no-git-tag-version
          npm install --package-lock-only --ignore-scripts
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"

      # Notes for the upcoming release are written manually to releases/release.md and are published as is.
      # The file is renamed to releases/<version>.md and an empty one is left for the next release, both are
      # committed with the version bump. Checked before the image is pushed, so a major release cannot be made
      # without notes.
      - name: Prepare release notes
        id: notes
        run: |
          DRAFT="releases/release.md"
          NOTES="releases/${{ steps.bump.outputs.new_version }}.md"
          if [ -f "${DRAFT}" ] && grep -q '[^[:space:]]' "${DRAFT}"; then
            if [ -e "${NOTES}" ]; then
              echo "::error::${NOTES} already exists, cannot move ${DRAFT} there"
              exit 1
            fi
            mv "${DRAFT}" "${NOTES}"
            : > "${DRAFT}"
            echo "Using release notes from ${DRAFT}, moved to ${NOTES}"
            echo "path=${NOTES}" >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.bump }}" = "major" ]; then
            echo "::error::Major release requires release notes, ${DRAFT} is empty"
            exit 1
          else
            echo "${DRAFT} is empty, release notes will be generated"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ !inputs.dry-run }}
          tags: |
            bryntum/pdf-export-server:${{ steps.bump.outputs.new_version }}
            bryntum/pdf-export-server:latest


      - name: Configure git
        if: ${{ !inputs.dry-run }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Commit, tag and push
        if: ${{ !inputs.dry-run }}
        run: |
          git add package.json package-lock.json releases
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "${{ steps.bump.outputs.tag }}"
          git push origin HEAD
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.bump.outputs.tag }}
          name: ${{ steps.bump.outputs.tag }}
          # Empty path means there are no written notes for this version
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          prerelease: ${{ inputs.prerelease }}
          draft: false

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "## Release Summary"
            echo ""
            echo "- **Previous version:** ${{ steps.bump.outputs.current_version }}"
            echo "- **New version:** ${{ steps.bump.outputs.new_version }}"
            echo "- **Tag:** ${{ steps.bump.outputs.tag }}"
            echo "- **Pre-release:** ${{ inputs.prerelease }}"
            echo "- **Dry run:** ${{ inputs.dry-run }}"
            echo "- **Release notes:** ${{ steps.notes.outputs.path || 'auto-generated' }}"
            echo "- **Docker image:** bryntum/pdf-export-server:${{ steps.bump.outputs.new_version }}"
          } >> "$GITHUB_STEP_SUMMARY"
